<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日医讯</title>
<style>
:root{--paper:#faf8f5;--card:#fffdf9;--line:#e8e3db;--tx:#1b1b1f;--sub:#7a756c;--faint:#a8a29a;--acc:#9e2b25;--acc-soft:#f6eeec}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:var(--paper);color:var(--tx);font:14px/1.75 "PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 40px}

/* ── 页头（紧凑单行，冻结） ── */
.sitehead{display:flex;align-items:center;gap:24px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:50}
.brand{font-size:20px;font-weight:700;letter-spacing:4px;flex-shrink:0;color:var(--tx);text-decoration:none}
nav{display:flex;gap:4px 22px;flex-wrap:wrap}
nav a{font-size:13.5px;color:var(--sub);text-decoration:none;letter-spacing:1px;padding:4px 1px;position:relative}
nav a:hover{color:var(--tx)}
nav a.on{color:var(--tx);font-weight:600}
nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--acc)}
.search{flex:1;min-width:160px;max-width:260px;margin-left:auto}
.search input{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:2px;font-size:13px;background:var(--card);color:var(--tx);outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--tx)}
.search input::placeholder{color:var(--faint)}

/* ── 回到顶部 ── */
#backtop{position:fixed;right:20px;bottom:28px;width:44px;height:44px;border-radius:50%;border:1px solid var(--tx);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer;display:none;z-index:80;transition:all .2s;line-height:1}
#backtop:hover{background:var(--tx);color:var(--paper)}

/* ── 卡片与列表 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:20px 24px;margin:16px 0}
.card h2{font-size:17px;letter-spacing:2px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.card h2 .h2sub{font-size:12px;color:var(--faint);letter-spacing:1px;font-weight:400;margin-left:10px}
.ai{border-left:3px solid var(--acc)}
.ai pre{font-size:13.5px;color:#3d382f}
.main{margin-right:304px}
.item{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item:last-child{border-bottom:none}
.idx{font-size:13px;color:var(--faint);min-width:26px;padding-top:4px;font-variant-numeric:tabular-nums;text-align:right}
.meta{color:var(--sub);font-size:12px;margin-top:5px;letter-spacing:.3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta a{color:var(--sub);text-decoration:none}
.meta a:hover{color:var(--acc)}
.ttl{font-size:16.5px;font-weight:600;line-height:1.55}
a{color:var(--tx);text-decoration:none}
a:hover{color:var(--acc)}
.thumb31{width:124px;aspect-ratio:3/4;object-fit:cover;border-radius:3px;flex-shrink:0;background:var(--paper);border:1px solid var(--line)}
.badge{display:inline-block;padding:0 8px;font-size:11px;letter-spacing:1px;border:1px solid var(--acc);color:var(--acc);border-radius:2px;text-decoration:none}
.badge:hover{background:var(--acc-soft)}
.body-text{color:#57534a;margin-top:5px;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.zoom{cursor:zoom-in}
.lightbox{position:fixed;inset:0;background:rgba(20,18,15,.9);display:none;align-items:center;justify-content:center;z-index:100;cursor:zoom-out}
.lightbox img{max-width:92vw;max-height:92vh;border-radius:3px}
.lightbox.on{display:flex}
.modal{position:fixed;inset:0;background:rgba(20,18,15,.55);display:none;align-items:center;justify-content:center;z-index:90}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:3px;max-width:640px;width:92%;max-height:86vh;overflow-y:auto;padding:24px 28px;position:relative;border-top:3px solid var(--tx)}
.mbox .mclose{position:sticky;top:0;float:right;cursor:pointer;font-size:16px;color:var(--sub);background:none;border:none}
.mbox .mclose:hover{color:var(--acc)}
.mbox h2{font-size:18px;margin:4px 0 8px;padding-right:24px;line-height:1.5}
.mbox .mmeta{color:var(--sub);font-size:12px;margin-bottom:10px;letter-spacing:.5px}
.mbox .mbody{font-size:13.5px;line-height:1.8;color:var(--tx);white-space:pre-wrap}
.mbox .mbtn{display:inline-block;margin-top:16px;padding:8px 22px;border:1px solid var(--tx);color:var(--tx);border-radius:2px;font-size:12px;letter-spacing:2px;text-decoration:none;transition:all .2s}
.mbox .mbtn:hover{background:var(--tx);color:var(--paper)}
.mbox .mcover{width:100%;max-height:420px;object-fit:cover;border-radius:3px;margin-bottom:12px}
.empty{color:var(--faint);padding:32px;text-align:center;letter-spacing:2px;font-size:13px}
pre{white-space:pre-wrap;font:inherit}

/* ── 筛选条 ── */
.filters{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap;align-items:center}
.filters.first{margin-top:16px}
.filters .meta{margin-right:2px;margin-top:0}
.filters a.sbtn{padding:3px 12px;border:1px solid var(--line);border-radius:2px;font-size:12px;background:var(--card);color:var(--sub);letter-spacing:.5px;text-decoration:none;transition:all .15s}
.filters a.sbtn:hover{border-color:var(--sub);color:var(--tx)}
.filters a.sbtn.on{background:var(--tx);color:var(--paper);border-color:var(--tx)}

/* ── 列表工具行 / 排序切换 ── */
.listbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.togglebtn{padding:5px 16px;border:1px solid var(--tx);border-radius:2px;font-size:12.5px;letter-spacing:1px;color:var(--tx);background:var(--card);text-decoration:none;transition:all .2s}
.togglebtn:hover{background:var(--tx);color:var(--paper)}

/* ── 月份标签行（横向滚动） ── */
.chiprow{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding-bottom:4px;scrollbar-width:thin;flex:1;min-width:0}
.chiprow a{flex-shrink:0}

/* ── 分页 ── */
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:20px 0 6px;flex-wrap:wrap}
.pager a.pbtn{padding:5px 14px;border:1px solid var(--line);border-radius:2px;font-size:12.5px;color:var(--sub);background:var(--card);letter-spacing:1px;text-decoration:none;transition:all .15s}
.pager a.pbtn:hover{border-color:var(--sub);color:var(--tx)}
.pager a.pbtn.dis{opacity:.35;pointer-events:none}
.pager .pcur{font-size:12.5px;color:var(--sub);letter-spacing:1px;font-variant-numeric:tabular-nums}
.pager .pjump{display:flex;gap:6px;align-items:center;margin-left:6px}
.pager .pjump input{width:54px;padding:5px 8px;border:1px solid var(--line);border-radius:2px;font-size:12.5px;background:var(--card);color:var(--tx);text-align:center;outline:none}
.pager .pjump input:focus{border-color:var(--tx)}
.pager .pjump button{padding:5px 12px;border:1px solid var(--tx);border-radius:2px;font-size:12.5px;background:var(--card);color:var(--tx);letter-spacing:1px;cursor:pointer}
.pager .pjump button:hover{background:var(--tx);color:var(--paper)}

/* ── 洞察里的原文链接 ── */
.ref-link{color:var(--acc);font-size:12px;letter-spacing:1px;text-decoration:none;border-bottom:1px solid var(--acc);margin:0 3px;white-space:nowrap}
.ref-link:hover{background:var(--acc-soft)}

/* ── 热榜侧栏 ── */
.float{position:fixed;right:44px;top:34vh;width:276px;max-height:56vh;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--tx);border-radius:3px;padding:0 18px 16px;z-index:10}
.float .fhead{position:sticky;top:0;background:var(--card);padding-top:16px;z-index:2}
.float h3{font-size:14px;letter-spacing:3px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.float .ft{display:flex;gap:6px;margin-bottom:4px;padding-bottom:6px}
.float .ft a{padding:2px 10px;border-radius:2px;font-size:11px;border:1px solid var(--line);color:var(--sub);letter-spacing:1px;text-decoration:none}
.float .ft a.on{background:var(--tx);color:var(--paper);border-color:var(--tx)}
.float .fitem{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:flex-start;line-height:1.5}
.float .fitem:last-child{border-bottom:none}
.float .frk{color:var(--faint);min-width:18px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;padding-top:2px}
.float .fitem:nth-child(-n+4) .frk{color:var(--acc);font-weight:700}
.float .ftitle{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ai-btn{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;font-size:11px;padding:1px 9px;cursor:pointer;vertical-align:2px;letter-spacing:1px;transition:all .15s}
.ai-btn:hover{background:var(--acc);color:#fff}
.mbox .report-sec{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;font-size:14px;letter-spacing:2px;color:var(--acc);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.mbox .report-p{margin:6px 0;line-height:1.8;color:var(--tx)}
.mbox .report-cmt{margin:4px 0 4px 14px;padding:4px 10px;border-left:2px solid var(--line);background:var(--paper);font-size:12.5px;color:#57534a}

footer{text-align:center;padding:32px 0 8px;margin-top:8px;border-top:1px solid var(--line)}
footer .f-title{font-size:15px;letter-spacing:4px;margin-bottom:4px}
footer p{font-size:11px;color:var(--faint);letter-spacing:1px}

@media(max-width:900px){.main{margin-right:0}.float{position:static;width:100%;max-height:none;margin:14px 0}
.brand{font-size:17px}.search{margin-left:0;max-width:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="sitehead">
    <a class="brand serif" href="#/">每日医讯</a>
    <nav id="nav"></nav>
    <div class="search"><form id="sform"><input name="q" id="sq" placeholder="搜索标题 / 来源 / 摘要…"></form></div>
  </header>
  <div id="body"></div>
  <footer><div class="f-title serif">每日医讯</div><p>DAILY MEDICAL BRIEFING · 数据每日更新</p></footer>
</div>
<button id="backtop" title="回到顶部">↑</button>
<div class="lightbox" id="lightbox"><img src="" alt="大图"></div>
<div class="modal" id="modal"><div id="mbody"></div></div>
<script src="data.js"></script>
<script>
const PLATFORMS=["B站","小红书","抖音","公众号","YouTube","行业网站"]; // 视频号 API 下线中，暂隐藏（2026-08-31）
const CATS=["前沿研究","医学新闻","实用干货","健康科普","深度解读","行业舆情","日常其他"];
const PER=50;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n>=10000?(n/10000).toFixed(1).replace(/\.0$/,'')+'万':n;
const today=new Date().toISOString().slice(0,10);

// ── 路由：#/  #/platform/B站?sort=&cat=&month=&page=&range=  #/search?q=
function route(){
  const h=location.hash.slice(1)||'/';
  const [path,qs]=h.split('?');
  const p=new URLSearchParams(qs||'');
  const seg=path.split('/').filter(Boolean);
  if(seg[0]==='platform'&&PLATFORMS.includes(decodeURIComponent(seg[1]||''))) return {v:'platform',name:decodeURIComponent(seg[1]),sort:p.get('sort')||'time',cat:p.get('cat')||'',month:p.get('month')||'',page:Math.max(1,parseInt(p.get('page'))||1),range:p.get('range')||'7d'};
  if(seg[0]==='search') return {v:'search',q:p.get('q')||''};
  return {v:'home',date:p.get('date')||''};
}
const go=h=>{location.hash=h;};
const qs=o=>{const s=new URLSearchParams(Object.entries(o).filter(([,v])=>v!==''&&v!=null)).toString();return s?'?'+s:'';};

// ── 洞察链接：🔗+裸URL → 「原文 ›」
function rich(t){
  if(!t)return '';
  return esc(t).replace(/🔗?\s*(https?:\/\/[^\s🔗]+)/g,'<a class="ref-link" href="$1" target="_blank" rel="noopener">原文 ›</a>');
}

// ── 条目渲染 ──
function itemHTML(it,i,rank){
  const rk=rank?`<div class="idx serif">${String(rank).padStart(2,'0')}</div>`:'';
  const stats=Object.entries(it.n).map(([k,v])=>`${k} ${fmt(v)}`).join(' · ');
  const src=it.h?`<a href="${esc(it.h)}" target="_blank" rel="noopener">${esc(it.a)}</a>`:`<span>${esc(it.a)}</span>`;
  const badge=it.g.length?`<a class="badge" href="#/platform/${encodeURIComponent(it.p)}${qs({cat:it.g[0]})}">${esc(it.g[0])}</a>`:'';
  // AI 摘要功能目前只保留 B站（2026-08-25 定稿）
  const ai=(it.r||it.s)&&it.p==='B站'?`<button class="ai-btn" data-ai="${i}">AI 摘要</button>`:'';
  const tgt=it.p==='小红书'?(it.h||it.u):it.u;  // 小红书跳作者主页（防限流登录墙）
  const head=tgt&&it.p!=='视频号'?`<a href="${esc(tgt)}" target="_blank" rel="noopener"><span class="ttl serif">${esc(it.t)}</span></a>`:`<span class="ttl serif">${esc(it.t)}</span>`;
  const en=it.e&&it.e['原文']?`<div class="meta">${esc(it.e['原文'])}</div>`:'';
  const meta=`<div class="meta">${src}${it.d?`<span> · ${it.d}</span>`:''}${stats?`<span> · ${stats}</span>`:''}${badge}${ai}</div>`;
  if(it.p==='小红书'){
    const thumb=it.c?`<img class="thumb31 zoom" src="${it.c}" data-zoom loading="lazy" onerror="this.remove()">`:'';
    const body=`<div class="body-text">${esc(it.s||'（无正文）')}</div>`;
    return `<div class="item">${rk}${thumb}<div style="flex:1;min-width:0">${head}${meta}${body}</div></div>`;
  }
  return `<div class="item">${rk}<div style="flex:1;min-width:0">${head}${en}${meta}</div></div>`;
}

// ── 首页 ──
function renderHome(r){
  const latestK=DATA.reduce((m,x)=>x.k>m?x.k:m,'');
  const date=r.date||(SUMMARY.length?SUMMARY[0].d:latestK);
  const s=SUMMARY.find(x=>x.d===date);
  // 当日更新口径（2026-08-25 定稿）：发布时间 ∈ {今天, 昨天}，严格窗口
  const yday=new Date(Date.now()-864e5).toISOString().slice(0,10);
  const items=[];DATA.forEach((x,i)=>{if(x.d&&x.d>=yday)items.push([x,i])});
  let h=`<div class="card ai"><h2 class="serif">每日摘要<span class="h2sub">${date}</span></h2>
    <div class="filters first"><span class="meta">日期</span>
    ${SUMMARY.map(x=>`<a class="sbtn ${x.d===date?'on':''}" href="#/${qs({date:x.d})}">${x.d.slice(5)}</a>`).join('')}
    <span class="meta">（今日 ${today}）</span></div>`;
  if(s){
    h+=`<h2 class="serif" style="border:none;margin:10px 0 4px;padding:0">今日内容速览</h2><pre>${rich(s.h)}</pre>
    ${s.t?`<h2 class="serif" style="margin:12px 0 4px;padding:0;border:none">新媒体选题建议</h2><pre>${rich(s.t)}</pre>`:''}
    <div class="meta">覆盖内容 ${s.n} 条</div>`;
  }else{
    h+=`<div class="empty">—— 该日期暂无摘要 ——</div>`;
  }
  h+=`</div><div class="card"><h2 class="serif">当日更新<span class="h2sub">${yday.slice(5)} ~ ${today.slice(5)} · 共 ${items.length} 条</span></h2>`;
  h+=items.length?items.slice(0,200).map(([x,i],k)=>itemHTML(x,i,k+1)).join(''):'<div class="empty">—— 该窗口内暂无内容 ——</div>';
  return h+'</div>';
}

// ── 平台页 ──
function hotOf(x){const v=Object.values(x.n);return v.length?v[0]:0;}
function renderPlatform(r){
  const name=r.name;
  const pool=[];DATA.forEach((x,i)=>{
    if(x.p!==name)return;
    if(r.cat&&!x.g.includes(r.cat))return;
    if(r.month&&x.d.slice(0,7)!==r.month)return;
    pool.push([x,i]);
  });
  if(r.sort==='views')pool.sort((a,b)=>hotOf(b[0])-hotOf(a[0])); // 时间序已由导出保证
  const total=pool.length, pages=Math.max(1,Math.ceil(total/PER));
  const page=Math.min(r.page,pages);
  const slice=pool.slice((page-1)*PER,page*PER);
  const months=[...new Set(DATA.filter(x=>x.p===name&&x.d).map(x=>x.d.slice(0,7)))].sort().reverse();

  // 热榜 TOP20
  const days={'7d':7,'30d':30,'all':null}[r.range];
  const since=days?new Date(Date.now()-days*864e5).toISOString().slice(0,10):null;
  const top=[];DATA.forEach((x,i)=>{if(x.p===name&&(!since||x.d>=since))top.push([x,i])});
  top.sort((a,b)=>hotOf(b[0])-hotOf(a[0]));

  const link=(over)=>`#/platform/${encodeURIComponent(name)}${qs({sort:r.sort,cat:r.cat,month:r.month,range:r.range,...over})}`;
  let h=`<div class="float"><div class="fhead"><h3 class="serif">热榜 · TOP20</h3>
    <div class="ft">${['7d','30d','all'].map(g=>`<a class="${g===r.range?'on':''}" href="${link({range:g,page:''})}">${g}</a>`).join('')}</div></div>
    ${top.slice(0,20).map(([x,i],k)=>`<div class="fitem"><span class="frk">${k+1}</span>${(()=>{const t=x.p==='小红书'?(x.h||x.u):x.u;return t&&name!=='视频号'?`<a class="ftitle" href="${esc(t)}" target="_blank" rel="noopener">${esc(x.t)}</a>`:`<span class="ftitle">${esc(x.t)}</span>`;})()}${(x.r||x.s)&&x.p==='B站'?`<button class="ai-btn" style="font-size:10px;padding:0 6px" data-ai="${i}">AI</button>`:''}</div>`).join('')}
  </div>`;
  h+=`<div class="main">
    <div class="filters first"><span class="meta">分类</span>
      <a class="sbtn ${!r.cat?'on':''}" href="${link({cat:'',page:''})}">全部</a>
      ${CATS.map(c=>`<a class="sbtn ${r.cat===c?'on':''}" href="${link({cat:c,page:''})}">${c}</a>`).join('')}
    </div>
    <div class="filters"><span class="meta">月份</span>
      <div class="chiprow">
        <a class="sbtn ${!r.month?'on':''}" href="${link({month:'',page:''})}">全部</a>
        ${months.map(m=>`<a class="sbtn ${r.month===m?'on':''}" href="${link({month:m,page:''})}">${m}</a>`).join('')}
      </div>
    </div>
    <div class="listbar">
      <span class="meta" style="margin:0">共 ${total} 条 · 第 ${page} / ${pages} 页</span>
      <a class="togglebtn" href="${link({sort:r.sort==='time'?'views':'time',page:''})}" title="点击切换排序方式">排序：${r.sort==='time'?'按时间':'按热度'} ⇄</a>
    </div>
    <div class="card">`;
  h+=slice.length?slice.map(([x,i],k)=>itemHTML(x,i,(page-1)*PER+k+1)).join(''):'<div class="empty">—— 该筛选条件下暂无数据 ——</div>';
  h+=`</div><div class="pager">
    <a class="pbtn ${page<=1?'dis':''}" href="${link({page:1})}">首页</a>
    <a class="pbtn ${page<=1?'dis':''}" href="${link({page:page-1})}">上一页</a>
    <span class="pcur">${page} / ${pages}</span>
    <a class="pbtn ${page>=pages?'dis':''}" href="${link({page:page+1})}">下一页</a>
    <a class="pbtn ${page>=pages?'dis':''}" href="${link({page:pages})}">末页</a>
    <form class="pjump" data-jump="${esc(link({page:''}))}">
      <input type="number" name="page" min="1" max="${pages}" placeholder="页码">
      <button type="submit">跳转</button>
    </form>
  </div></div>`;
  return h;
}

// ── 搜索页 ──
function renderSearch(r){
  const q=r.q.trim().toLowerCase();
  if(!q)return '<div class="empty">请输入关键词</div>';
  const hits=[];DATA.forEach((x,i)=>{if(x.t.toLowerCase().includes(q)||x.s.toLowerCase().includes(q)||x.a.toLowerCase().includes(q)||(x.e['原文']||'').toLowerCase().includes(q))hits.push([x,i])});
  hits.sort((a,b)=>hotOf(b[0])-hotOf(a[0]));
  return `<div class="card"><h2 class="serif">搜索<span class="h2sub">「${esc(r.q)}」 · 共 ${hits.length} 条</span></h2>`
    +(hits.length?hits.slice(0,50).map(([x,i],k)=>itemHTML(x,i,k+1)).join(''):'<div class="empty">—— 没有匹配的内容 ——</div>')+'</div>';
}

// ── 渲染 ──
function render(){
  const r=route();
  document.querySelectorAll('#nav a').forEach(a=>{
    a.classList.toggle('on',(r.v==='home'&&a.dataset.p==='')||(r.v==='platform'&&a.dataset.p===r.name));
  });
  document.getElementById('sq').value=r.v==='search'?r.q:'';
  document.getElementById('body').innerHTML=r.v==='platform'?renderPlatform(r):r.v==='search'?renderSearch(r):renderHome(r);
  if(!location.hash||location.hash==='#/'){}else window.scrollTo(0,0);
}
document.getElementById('nav').innerHTML=`<a href="#/" data-p="">今日</a>`+PLATFORMS.map(p=>`<a href="#/platform/${encodeURIComponent(p)}" data-p="${p}">${p}</a>`).join('');
window.addEventListener('hashchange',render);

// 搜索
document.getElementById('sform').addEventListener('submit',e=>{e.preventDefault();go('/search'+qs({q:document.getElementById('sq').value.trim()}));});

// 委托：AI 弹窗 / 封面放大 / 跳页
document.addEventListener('click',e=>{
  const ai=e.target.closest('[data-ai]');
  if(ai){openModal(+ai.dataset.ai);return;}
  const z=e.target.closest('[data-zoom]');
  if(z){const lb=document.getElementById('lightbox');lb.querySelector('img').src=z.src;lb.classList.add('on');return;}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('.pjump');
  if(f){e.preventDefault();const p=parseInt(f.page.value);if(p>=1)f.action,go(f.dataset.jump.replace(/&$/,'')+`&page=${p}`);}
});
// AI 分析报告排版：【段标题】→ serif 红色小标，其余 → 段落；评论引用 → 缩进引用样式
function formatAI(text){
  if(!text)return '';
  const lines=text.split('\n');let h='';
  for(const l0 of lines){
    const l=l0.trim();if(!l)continue;
    const m=l.match(/^【(.+?)】\s*(.*)$/);
    if(m){h+=`<div class="report-sec">${esc(m[1])}</div>`;if(m[2])h+=`<p class="report-p">${esc(m[2])}</p>`;}
    else if(l.indexOf('“')===0||/^[“"].*[”"]$/.test(l)){h+=`<div class="report-cmt">${esc(l)}</div>`;}
    else{h+=`<p class="report-p">${esc(l)}</p>`;}
  }
  return h;
}
function openModal(i){
  const d=DATA[i];if(!d)return;
  let h='<div class="mbox"><button class="mclose" id="mclose">×</button>';
  if(d.p==='小红书'){
    h+=(d.c?`<img class="mcover" src="${d.c}" onerror="this.remove()">`:``)
      +`<h2 class="serif">${esc(d.t)}</h2><div class="mbody">${esc(d.s||'（无正文）')}</div>`
      +`<div class="mmeta">${esc(d.a)} · ${d.d}${Object.entries(d.n).map(([k,v])=>' · '+k+' '+fmt(v)).join('')}</div>`;
  }else{
    h+=`<h2 class="serif">${esc(d.t)}</h2><div class="mmeta">${d.p} · ${esc(d.a)} · ${d.d}${Object.entries(d.n).map(([k,v])=>' · '+k+' '+fmt(v)).join('')}</div>`
      +`<div class="mbody">${esc(d.s||'')}${d.r?'<div style="margin-top:8px">'+formatAI(d.r)+'</div>':''}</div>`;
  }
  if(d.u)h+=`<a class="mbtn" href="${esc(d.u)}" target="_blank" rel="noopener">阅读原文</a>`;
  h+='</div>';
  document.getElementById('mbody').innerHTML=h;
  document.getElementById('modal').classList.add('on');
  document.getElementById('mclose').onclick=()=>document.getElementById('modal').classList.remove('on');
}
document.getElementById('modal').addEventListener('click',function(){this.classList.remove('on');});
document.getElementById('lightbox').addEventListener('click',function(){this.classList.remove('on');});

// 回到顶部
const bt=document.getElementById('backtop');
window.addEventListener('scroll',()=>{bt.style.display=window.scrollY>400?'block':'none';});
bt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

// 月份行滚轮横滑
document.addEventListener('wheel',e=>{
  const el=e.target.closest('.chiprow');
  if(el&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault();}
},{passive:false});

render();
</script>
